name: Título do PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - name: Conventional Commits no título (vira o commit do squash)
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            security
            perf
            refactor
            docs
            test
            ci
            build
            chore
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            A descrição "{subject}" deve começar com letra minúscula
            (ex.: "fix(cli): corrige o código de saída").
